# Trang tĩnh MeeGame (meegame.shop) và các game tự làm trong thư mục con (vd /quanlau/ = Lẩu Ơi!). Traefik lo TLS, nginx chỉ nghe 8080 trong mạng coolify.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # /quanlau → /quanlau/ giữ nguyên tên miền (không lộ cổng 8080 bên trong).
    absolute_redirect off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # File ẩn (.git, .env...) không bao giờ lộ ra.
    location ~ /\. { return 404; }

    # Trang và script đổi thường xuyên: luôn hỏi lại máy chủ (vẫn dùng ETag nên không tải lại nếu không đổi).
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Ảnh bìa game (làm sẵn, 720x504 + bản nhỏ -s): nhớ 1 ngày, sửa ảnh thì vài giờ sau mới thấy hết.
    location /covers/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
