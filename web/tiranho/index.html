<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiramisu Xe Đẩy</title>
<meta name="theme-color" content="#FFE6DC">
<link rel="icon" type="image/png" href="/tiranho/favicon.png">
<link rel="apple-touch-icon" href="/tiranho/apple-touch-icon.png">
<link rel="manifest" href="/tiranho/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiramisu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { --bg: #2B1A16; --ink: #3A2219; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1E1310; } }
  :root[data-theme="dark"] { --bg: #1E1310; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Be Vietnam Pro', system-ui, sans-serif; }
  #wrap { position: relative; height: 100dvh; aspect-ratio: 9 / 16; max-width: 100vw; }
  #cv { width: 100%; height: 100%; display: block; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  @media (max-width: 600px) { #cv { border-radius: 0; } #wrap { width: 100vw; height: 100dvh; aspect-ratio: auto; } }
  /* ---- lớp quản lý quán / cài đặt (HTML phủ trên canvas, co giãn theo bề rộng khung game) ---- */
  #wrap { container-type: inline-size; }
  #ov { position: absolute; inset: 0; z-index: 5; display: flex; align-items: stretch; justify-content: center; background: rgba(40, 22, 16, .55); font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #3A2219; font-size: clamp(13px, 3.4cqw, 18px); }
  #ov[hidden] { display: none; }
  #ov .sheet { margin: 3.5cqw 3cqw; flex: 1; display: flex; flex-direction: column; background: #FFF9F1; border: 3px solid #F2A7BA; border-radius: 5cqw; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #ov header { display: flex; align-items: center; gap: 8px; padding: 3.2cqw 4cqw 1.6cqw; }
  #ov h2 { flex: 1; margin: 0; font: 800 clamp(20px, 6.4cqw, 34px)/1.1 'Baloo 2', 'Be Vietnam Pro', sans-serif; color: #C2416B; }
  #ovClose { width: 10cqw; height: 10cqw; min-width: 40px; min-height: 40px; border-radius: 50%; border: 0; background: #F6E3D6; color: #8A4B2A; font-size: 1.3em; font-weight: 800; cursor: pointer; }
  #ovClose[hidden] { display: none; }
  #ovTabs { display: flex; gap: 1cqw; overflow-x: auto; overflow-y: hidden; padding: 1.2cqw 3cqw 0; margin: 0 1cqw; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; background: var(--tabbg, #F3E3D0); border-radius: 4cqw 4cqw 0 0; cursor: grab; user-select: none; }
  #ovTabs::-webkit-scrollbar { display: none; }
  #ovTabs:empty { display: none; }
  #ovTabs button { flex: 0 0 auto; min-width: 17cqw; display: flex; flex-direction: column; align-items: center; gap: 1px; border: 0; background: transparent; color: #5A3E2E; border-radius: 3cqw 3cqw 0 0; padding: .5em .5em .45em; font: 700 .76em/1.1 'Be Vietnam Pro', sans-serif; cursor: pointer; white-space: nowrap; transition: background .15s; }
  #ovTabs button .icn { width: 2.7em; height: 2.7em; margin: 0 0 .15em; filter: drop-shadow(0 2px 0 rgba(0,0,0,.08)); }
  #ovTabs button[aria-pressed="true"] { background: var(--sheet, #FFF9F1); color: #3A2219; font-weight: 800; box-shadow: 0 -2px 8px rgba(120,80,40,.12); }
  #ovTabBar { display: flex; align-items: center; gap: 2cqw; padding: 1.2cqw 4cqw 1.6cqw; }
  #ovTabBar[hidden] { display: none; }
  #ovTabBar button { border: 0; background: none; color: #8A6A5A; font-size: .8em; cursor: pointer; padding: 0 .3em; }
  #tabTrack { position: relative; flex: 1; height: 8px; border-radius: 6px; background: #EDE0D2; cursor: pointer; }
  #tabThumb { position: absolute; top: 0; height: 100%; border-radius: 6px; background: #8A7A6E; }
  #ovBody { flex: 1; overflow-y: auto; padding: 0 4cqw 4cqw; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #ovFoot { display: flex; gap: 2.5cqw; padding: 2.5cqw 4cqw 3.5cqw; border-top: 2px dashed #F1D9C6; }
  #ovFoot:empty { display: none; }
  #ovFoot .btn { flex: 1; padding: .8em; font-size: 1.05em; }
  #ov .btn { border: 0; border-radius: 99px; padding: .6em 1.1em; background: linear-gradient(#EE7393, #E8557A); color: #fff; font: 800 .95em 'Be Vietnam Pro', sans-serif; box-shadow: 0 3px 0 #B8395A; cursor: pointer; }
  #ov .btn.go { background: linear-gradient(#5DB377, #3E9A5A); box-shadow: 0 3px 0 #2E7442; }
  #ov .btn.ghost { background: #F6E3D6; color: #8A4B2A; box-shadow: 0 3px 0 #E0C2AE; }
  #ov .btn.sm { font-size: .85em; padding: .5em .9em; }
  #ov .btn:disabled { background: #D9CEC5; box-shadow: none; color: #F7F2EE; cursor: default; }
  #ov .note { margin: .2em 0 .9em; color: #7A5A48; font-size: .88em; line-height: 1.45; }
  #ov .lvbar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; background: #fff; border: 2px solid #F2D9A0; border-radius: 4cqw; padding: .7em .9em; margin-bottom: .7em; }
  #ov .lvbar small { display: block; color: #8A6A5A; font-size: .8em; }
  #ov .lvbar i { grid-column: 1; height: 10px; border-radius: 6px; background: #F1E6DA; overflow: hidden; }
  #ov .lvbar s { display: block; height: 100%; background: linear-gradient(90deg, #F2D06B, #F2B632); }
  #ov .lvbar em { grid-column: 2; grid-row: 1 / span 2; font-style: normal; font-weight: 800; }
  #ov .card { display: flex; gap: 3cqw; background: #fff; border: 2px solid #EBD9C8; border-radius: 4cqw; padding: .7em; margin-bottom: .7em; }
  #ov .card.on { border-color: #7CC35A; background: #F5FBF0; }
  #ov .card.lock { opacity: .62; }
  #ov .card .por { width: 24cqw; height: 30cqw; flex: none; border-radius: 3cqw; background: linear-gradient(#FFF3E6, #F7E2CF); }
  #ov .card .lgc { width: 15cqw; height: 15cqw; flex: none; }
  #ov .card .ic { width: 13cqw; height: 13cqw; flex: none; display: grid; place-items: center; background: #FFF3E6; border-radius: 3cqw; }
  #ov .card .ic .icn { width: 78%; height: 78%; margin: 0; }
  .icn { width: 1.3em; height: 1.3em; vertical-align: -.3em; margin: 0 .12em; }
  #ov .card .cb { flex: 1; min-width: 0; }
  #ov .card h4 { margin: 0 0 .2em; font-size: 1.05em; }
  #ov .card h4 span { font-weight: 600; color: #C2416B; font-size: .82em; }
  #ov .card p { margin: 0 0 .45em; color: #5A3E2E; font-size: .86em; line-height: 1.4; }
  #ov .meta { font-size: .8em; color: #8A6A5A; margin-bottom: .5em; }
  #ov .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #ov .ok { color: #3E7A2E; font-weight: 800; font-size: .9em; }
  #ov .lockt { color: #8A6A5A; font-weight: 700; font-size: .88em; }
  #ov .up { display: block; color: #8A6A5A; margin-top: .35em; font-size: .76em; }
  #ov .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  #ov .stats div { background: #fff; border: 2px solid #EBD9C8; border-radius: 3cqw; padding: .6em; text-align: center; }
  #ov .stats b { display: block; font-size: 1.1em; }
  #ov .stats small { color: #8A6A5A; }
  /* màn tạo quán */
  #ov .pv { display: flex; align-items: flex-end; gap: 3cqw; background: linear-gradient(#FFE9EF, #FFF6EC); border-radius: 4cqw; padding: 2cqw 3cqw; margin-bottom: .8em; }
  #ov .pv #pvChar { width: 28cqw; height: 35cqw; flex: none; }
  #ov .pvSign { flex: 1; display: flex; align-items: center; gap: 2.4cqw; background: #FFF7EE; border: 3px solid var(--c1, #E897AE); border-radius: 3.5cqw; padding: 2cqw; margin-bottom: 4cqw; box-shadow: 0 6px 0 var(--c0, #F9C9D6); min-width: 0; }
  #ov .pvSign canvas { width: 14cqw; height: 14cqw; flex: none; }
  #ov .pvSign b { display: block; font: 800 1.15em/1.1 'Baloo 2', sans-serif; color: #C2416B; overflow-wrap: anywhere; }
  #ov .pvSign small { color: #8A5A4A; font-size: .75em; }
  #ov .fld { display: block; font-weight: 800; font-size: .9em; margin: .5em 0 .3em; }
  #ov .fld input, #ov input { display: block; width: 100%; box-sizing: border-box; margin-top: .3em; padding: .6em .8em; border: 2px solid #E3CDB6; border-radius: 3cqw; font: 700 1.05em 'Be Vietnam Pro', sans-serif; color: #3A2219; background: #fff; }
  #ov .row input { flex: 1; width: auto; margin: 0; }
  #ov input:focus { outline: none; border-color: #E8557A; }
  #ov .ideas { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: .4em; }
  #ov .grp { margin: .8em 0; }
  #ov .grp h5 { margin: 0 0 .4em; font-size: .9em; }
  #ov .grp small { display: block; color: #8A6A5A; margin-top: .3em; }
  #ov .chip { border: 2px solid #E3CDB6; background: #fff; color: #5A3E2E; border-radius: 99px; padding: .4em .8em; margin: 0 4px 5px 0; font: 700 .85em 'Be Vietnam Pro', sans-serif; cursor: pointer; }
  #ov .chip[aria-pressed="true"] { border-color: #E8557A; background: #FFE3EA; color: #A8304F; }
  #ov .chip.cartc i { display: inline-block; width: 1em; height: 1em; border-radius: 4px; margin-right: .35em; vertical-align: -2px; }
  #ov .sw { width: 9cqw; height: 9cqw; min-width: 34px; min-height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #E3CDB6; margin: 0 6px 8px 0; cursor: pointer; color: #B5302A; font-weight: 800; }
  #ov .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px #E8557A; }
  #ov .sws { margin-top: .4em; }
  #ov .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #ov .pre, #ov .lg { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid #E3CDB6; background: #fff; border-radius: 3cqw; padding: 4px; font: 700 .8em 'Be Vietnam Pro', sans-serif; color: #5A3E2E; cursor: pointer; }
  #ov .pre canvas { width: 100%; aspect-ratio: 120 / 150; height: auto; }
  #ov .logos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #ov .lg canvas { width: 70%; aspect-ratio: 1; height: auto; }
  #ov .lg[aria-pressed="true"] { border-color: #E8557A; background: #FFE3EA; }
  /* cài đặt */
  #ov .setsec { background: #fff; border: 2px solid #EBD9C8; border-radius: 4cqw; padding: .8em .9em; margin-bottom: .7em; }
  #ov .setsec > b { display: block; margin-bottom: .2em; }
  #ov .setsec > small { display: block; color: #7A5A48; font-size: .84em; line-height: 1.45; margin-bottom: .5em; }
  #ov .setsec.danger { border-color: #F0C2C2; }
  #ov .acct { display: flex; align-items: center; gap: 10px; margin: .3em 0 .5em; }
  #ov .acct img { width: 40px; height: 40px; border-radius: 50%; }
  #ov .acct div { flex: 1; min-width: 0; }
  #ov .acct small { display: block; color: #8A6A5A; font-size: .8em; overflow: hidden; text-overflow: ellipsis; }
  #ov .gsi { min-height: 44px; display: flex; justify-content: center; align-items: center; color: #8A6A5A; font-size: .85em; }
  #ov .ver { text-align: center; color: #A08B7A; font-size: .78em; }
  #ov .rank { list-style: none; padding: 0; margin: 0; }
  #ov .rank li { display: grid; grid-template-columns: 2em 1fr auto; gap: 2px 8px; align-items: center; background: #fff; border: 2px solid #EBD9C8; border-radius: 3cqw; padding: .5em .7em; margin-bottom: 5px; }
  #ov .rank li.me { border-color: #E8557A; background: #FFF0F4; }
  #ov .rank em { grid-row: span 2; font-style: normal; font-weight: 800; color: #C2416B; font-size: 1.2em; }
  #ov .rank span { color: #8A6A5A; font-size: .8em; }
  #ov .rank i { grid-column: 3; grid-row: 1 / span 2; font-style: normal; font-weight: 800; }
  #ov .prow .pv2, #ov .pv2 { min-width: 6.5em; text-align: center; font-size: 1.05em; }
  #ov .pct { color: #8A6A5A; }
  #ov b.ok, #ov .ok { color: #3E7A2E; } #ov .warn { color: #B5302A; font-weight: 800; }
  #ov .trend { border-color: #F2B632; background: #FFF9E8; }
  #ov .rdtop { display: flex; gap: 3cqw; align-items: center; margin: .5em 0; }
  #ov .rdtop canvas { width: 26cqw; height: 26cqw; flex: none; }
  #ov .rdtop small { display: block; color: #7A5A48; font-size: .8em; }
  #ov .hot { height: 10px; border-radius: 6px; background: #F1E6DA; overflow: hidden; margin: .3em 0; }
  #ov .hot s { display: block; height: 100%; background: linear-gradient(90deg, #F7A9BE, #E8557A); }
  #ov .rdform .btn.go { width: 100%; margin-top: .6em; padding: .8em; }
  #ov .chip:disabled { opacity: .4; }
  #toast, #lvToast { position: absolute; left: 50%; transform: translate(-50%, -20px); opacity: 0; pointer-events: none; transition: .25s; z-index: 9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; text-align: center; }
  #toast { top: 3cqw; background: rgba(58,34,25,.92); color: #fff; padding: .6em 1.1em; border-radius: 99px; font-size: clamp(13px, 3.4cqw, 17px); font-weight: 700; max-width: 86%; }
  #lvToast { top: 28%; width: 78%; background: #FFF9F1; border: 4px solid #F2B632; border-radius: 5cqw; padding: 1em; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #lvToast b { display: block; font: 800 clamp(20px, 6.2cqw, 32px)/1.15 'Baloo 2', sans-serif; color: #C2416B; }
  #lvToast span { display: block; margin-top: .3em; color: #5A3E2E; font-size: clamp(13px, 3.4cqw, 17px); font-weight: 600; line-height: 1.4; }
  #toast.on, #lvToast.on { opacity: 1; transform: translate(-50%, 0); }
  #lvToast.on { pointer-events: auto; cursor: pointer; }
  /* kinh doanh quán */
  #ov .sec { margin: 1em 0 .5em; font-size: .95em; color: #C2416B; }
  #ov .stats.s3 { grid-template-columns: repeat(3, 1fr); margin: .5em 0; }
  #ov .stats.s3 b { font-size: .95em; }
  #ov .setsec .btn { margin-top: .5em; }
  #ov .setsec.gold { border-color: #F2C766; background: #FFF9E8; }
  #ov .warnrow { border-color: #F2B2A4 !important; background: #FFF4F1 !important; }
  #ov .pbar { height: 9px; border-radius: 6px; background: #F1E6DA; overflow: hidden; margin: .35em 0 .5em; }
  #ov .pbar s { display: block; height: 100%; background: linear-gradient(90deg, #F2D06B, #E8557A); }
  #ov .kho { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid #EBD9C8; border-radius: 3cqw; padding: .55em .7em; margin-bottom: 5px; }
  #ov .kho > div { flex: 1; min-width: 0; }
  #ov .kho small { display: block; color: #8A6A5A; font-size: .8em; }
  #ov .lots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: .3em; }
  #ov .lots span { font-size: .74em; font-weight: 700; padding: .15em .55em; border-radius: 99px; background: #EEF6E6; color: #3E6A2E; }
  #ov .lots span.mid { background: #FFF3D6; color: #8A5A0A; }
  #ov .lots span.bad { background: #FFE1DA; color: #A8301A; }
  #ov .prof { display: flex; align-items: center; gap: 3cqw; margin-bottom: .4em; }
  #ov .prof canvas { width: 15cqw; height: 15cqw; flex: none; }
  #ov .prof small { display: block; color: #8A6A5A; font-size: .8em; }
  #ov .tick { display: inline-grid; place-items: center; width: 1.2em; height: 1.2em; border-radius: 50%; background: #2E8AE6; color: #fff; font-style: normal; font-size: .8em; }
  #ov .post { background: #fff; border: 2px solid #EBD9C8; border-radius: 3cqw; padding: .6em .75em; margin-bottom: 6px; }
  #ov .post p { margin: .25em 0; font-size: .88em; color: #3A2219; }
  #ov .post small { color: #8A6A5A; font-size: .76em; }
  #ov .post .row { margin-top: .4em; }
  #ov .post .chip { font-size: .74em; padding: .35em .65em; margin: 0; }
  #ov .st { color: #F0A020; letter-spacing: 1px; font-size: .9em; }
  #ov .rep { margin-top: .4em; padding: .4em .6em; background: #FFF3F6; border-radius: 2cqw; font-size: .82em; color: #8A3B55; }
  #ov .rvsum { display: flex; gap: 4cqw; align-items: center; background: #fff; border: 2px solid #EBD9C8; border-radius: 4cqw; padding: .7em; margin-bottom: .6em; }
  #ov .rvsum .big { text-align: center; flex: none; }
  #ov .rvsum .big b { display: block; font: 800 2.2em/1 'Baloo 2', sans-serif; }
  #ov .rvsum .big small { display: block; color: #8A6A5A; font-size: .78em; }
  #ov .dist { flex: 1; }
  #ov .dist div { display: grid; grid-template-columns: 2.2em 1fr 2em; gap: 6px; align-items: center; font-size: .8em; margin: 2px 0; }
  #ov .dist i { height: 8px; border-radius: 5px; background: #F1E6DA; overflow: hidden; }
  #ov .dist s { display: block; height: 100%; background: #F2B632; }
  #ov .dist em { font-style: normal; color: #8A6A5A; text-align: right; }
  #ov .filt { margin-bottom: .5em; }
  #ov .chart { display: flex; align-items: flex-end; gap: 4px; height: 38cqw; background: #fff; border: 2px solid #EBD9C8; border-radius: 3cqw; padding: .6em .5em 1.6em; }
  #ov .chart .col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 1px; position: relative; }
  #ov .chart .col i { width: 42%; border-radius: 3px 3px 0 0; min-height: 2px; }
  #ov .chart .col small { position: absolute; bottom: -1.5em; font-size: .68em; color: #8A6A5A; }
  #ov .chart .rev, #ov .legend .rev::before { background: #7EB6D9; }
  #ov .chart .pr, #ov .legend .pr::before { background: #5DB377; }
  #ov .chart .neg, #ov .legend .neg::before { background: #E8553F; }
  #ov .legend { display: flex; gap: 12px; justify-content: center; font-size: .78em; color: #6A4A3A; margin: .4em 0; }
  #ov .legend span::before { content: ''; display: inline-block; width: .8em; height: .8em; border-radius: 3px; margin-right: .3em; vertical-align: -1px; }
  #ov .best { margin: 0; padding: 0; list-style: none; counter-reset: b; }
  #ov .best li { display: flex; justify-content: space-between; background: #fff; border: 2px solid #EBD9C8; border-radius: 3cqw; padding: .45em .7em; margin-bottom: 4px; font-size: .9em; }
  #ov .best li span::before { counter-increment: b; content: counter(b) '. '; font-weight: 800; color: #C2416B; }
  /* màu giao diện */
  #ov .sheet { background: var(--sheet, #FFF9F1); border-color: var(--edge, #F2A7BA); }
  #ov[data-theme="dau"] { --sheet: #FFF4F6; --edge: #F49AB3; --tabbg: #FBDDE5; }
  #ov[data-theme="matcha"] { --sheet: #F6FAF0; --edge: #9CC46A; --tabbg: #E2EED3; }
  #ov[data-theme="matcha"] h2 { color: #4E7A2E; }
  #ov[data-theme="socola"] { --sheet: #FBF3EC; --edge: #8A5A3A; --tabbg: #EAD9CA; }
  #ov[data-theme="socola"] h2 { color: #6B3F25; }
  /* cài đặt dạng danh sách */
  #ov .slist { display: flex; flex-direction: column; gap: 6px; margin-bottom: .8em; }
  #ov .srow { display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 8px; text-align: left; border: 2px solid #EBD9C8; background: #FFFDF8; border-radius: 3.5cqw; padding: .6em .8em; font: 700 .95em 'Be Vietnam Pro', sans-serif; color: #3A2219; cursor: pointer; }
  #ov .srow:disabled { opacity: .55; cursor: default; }
  #ov .srow .si .icn { width: 1.7em; height: 1.7em; }
  #ov .srow em { font-style: normal; color: #8A6A5A; font-size: .85em; text-align: right; max-width: 12em; }
  #ov .srow.danger { border-color: #F0C2C2; color: #C0392B; }
  #ov textarea { width: 100%; box-sizing: border-box; margin: .4em 0; border: 2px solid #E3CDB6; border-radius: 3cqw; padding: .6em; font: 600 .8em/1.4 ui-monospace, monospace; color: #3A2219; background: #fff; word-break: break-all; }
  #ov .bk { justify-content: space-between; padding: .3em 0; border-bottom: 1px dashed #EBD9C8; }

<script>

const W = 720, H = 1280;

addEventListener('resize', resize);
const FONT = '"Be Vietnam Pro", system-ui, sans-serif', TITLE = '"Patrick Hand", "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif';

// ---------------------------------------------------------------- tiện ích vẽ
const TAU = Math.PI * 2;

function text(s, x, y, o = {}) {

  const { size = 28, color = '#3A2219', align = 'center', weight = 700, font = FONT, outline = null, ow = 6, base = 'middle', max } = o;

// ---------------------------------------------------------------- âm thanh nhỏ
let AC = null;
function beep(f = 660, d = 0.08, type = 'sine', v = 0.06) {

const sfx = {
  tap: () => beep(520, .06, 'triangle'), place: () => beep(380, .09, 'sine', .08), scoop: () => { beep(300, .07, 'triangle'); setTimeout(() => beep(450, .07, 'triangle'), 60); },
  good: () => { beep(660, .1); setTimeout(() => beep(880, .14), 90); }, coin: () => { beep(1200, .06, 'square', .03); setTimeout(() => beep(1600, .1, 'square', .03), 60); },
  bad: () => beep(180, .18, 'sawtooth', .04), pop: () => beep(900, .05, 'sine', .05),

// ---------------------------------------------------------------- các vị bánh (giống quầy ngoài đời)
const FLAVORS = {
  xoai:     { name: 'Xoài',        price: 35000, cream: '#FFF1C9', base: '#FFD36B', kind: 'cubes',  cols: ['#FFB21A', '#FF9C0A', '#FFC64A'], deco: 'mint', icon: '#FFAE1F' },
  vietquat: { name: 'Việt quất',   price: 40000, cream: '#E9D3EE', base: '#6B2F69', kind: 'berries', cols: ['#2E2550', '#3D3166', '#1F1A3D'], deco: 'daisy', icon: '#4A2F6E' },
  dualuoi:  { name: 'Dưa lưới',    price: 35000, cream: '#F2F7D9', base: '#CDE79A', kind: 'cubes',  cols: ['#9BD45B', '#B5E36F', '#86C449'], deco: 'berry', icon: '#9BD45B' },
  oreo:     { name: 'Oreo bồ hóng', price: 35000, cream: '#FFFDF8', base: '#F4EEE6', kind: 'soot',   cols: ['#1F1B1A', '#2E2826'], deco: 'crumb', icon: '#2A2422' },
  gau:      { name: 'Gấu sữa',     price: 40000, cream: '#EEF3D2', base: '#DCE7B0', kind: 'bear',   cols: ['#FFFDF6', '#F3E6D3'], deco: 'rosette', icon: '#E9E1CF' },
  saurieng: { name: 'Sầu riêng',   price: 45000, cream: '#FFF6D6', base: '#FBE7A8', kind: 'durian', cols: ['#F6DB86', '#EBC765'], deco: 'daisy', icon: '#F2D06B' },
};
const FLAVOR_KEYS = Object.keys(FLAVORS);
const PORTIONS = 6;

// ---------------------------------------------------------------- vẽ đồ trang trí nhỏ
function daisy(x, y, r = 9, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot);
  for (let i = 0; i < 10; i++) { g.save(); g.rotate(i * TAU / 10); ell(0, -r * 0.62, r * 0.26, r * 0.5, '#FFFFFF', 'rgba(170,160,140,.5)', .8); g.restore(); }
  ell(0, 0, r * 0.32, r * 0.32, rg(-1, -1, 0, r * .4, ['#FFE36B', '#F2B01E']));
  g.restore();
}
function mint(x, y, s = 1, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  for (const a of [-0.6, 0.6]) { g.save(); g.rotate(a); g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(7, -6, 0, -15); g.quadraticCurveTo(-7, -6, 0, 0); g.fillStyle = lg(0, -15, 0, 0, ['#7CC35A', '#3E8B34']); g.fill(); g.strokeStyle = 'rgba(30,70,25,.5)'; g.lineWidth = .8; g.beginPath(); g.moveTo(0, -1); g.lineTo(0, -12); g.stroke(); g.restore(); }
  g.restore();
}
function blueberry(x, y, r = 6) {
  ell(x, y, r, r, rg(x - r * .35, y - r * .35, 0, r * 1.1, ['#6C6AA8', '#2E2A5C', '#1B1838']));
  g.fillStyle = 'rgba(200,210,240,.5)'; g.beginPath(); g.ellipse(x - r * .35, y - r * .4, r * .32, r * .2, -.6, 0, TAU); g.fill();
  g.strokeStyle = '#120F26'; g.lineWidth = 1; g.beginPath(); for (let i = 0; i < 5; i++) { const a = i * TAU / 5; g.moveTo(x, y + r * .15); g.lineTo(x + Math.cos(a) * r * .28, y + r * .15 + Math.sin(a) * r * .28); } g.stroke();
}
function cube(x, y, s, col, rot = 0, light = '#FFFFFF') {
  g.save(); g.translate(x, y); g.rotate(rot);
  fillRR(-s / 2 + 1.5, -s / 2 + 2.5, s, s, s * 0.22, 'rgba(0,0,0,.12)');
  fillRR(-s / 2, -s / 2, s, s, s * 0.22, lg(-s / 2, -s / 2, s / 2, s / 2, [light === '#FFFFFF' ? shade(col, 1.25) : light, col, shade(col, .82)]));
  g.fillStyle = 'rgba(255,255,255,.45)'; rr(-s / 2 + s * .14, -s / 2 + s * .12, s * .38, s * .16, s * .08); g.fill();
  g.restore();
}
function shade(hex, k) {

}
/** Bồ hóng (cục bông đen mắt to) như khay oreo ngoài đời. */
function soot(x, y, r = 10, t = 0, seed = 0) {
  const bob = Math.sin(t * 3 + seed) * .6;
  g.save(); g.translate(x, y + bob);
  g.fillStyle = '#141111';
  g.beginPath(); for (let i = 0; i <= 28; i++) { const a = i / 28 * TAU, rr2 = r * (1 + (i % 2 ? .16 : -.04)); g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr2, Math.sin(a) * rr2 * .9); } g.closePath(); g.fill();

  ell(-r * .28, 0, r * .14, r * .17, '#111'); ell(r * .36, 0, r * .14, r * .17, '#111');
  ell(-r * .32, -r * .08, r * .05, r * .05, '#fff'); ell(r * .32, -r * .08, r * .05, r * .05, '#fff');

}
/** Gấu kem nhỏ (bánh quy hình gấu + bông kem). */
function bear(x, y, r = 12) {
  for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ell(x + Math.cos(a) * r * .95, y + r * .55 + Math.sin(a) * r * .35, r * .38, r * .3, '#FFFFFF', 'rgba(190,180,160,.6)', 1); }
  ell(x - r * .62, y - r * .58, r * .32, r * .32, '#FFFDF6', 'rgba(150,130,110,.6)', 1.2); ell(x + r * .62, y - r * .58, r * .32, r * .32, '#FFFDF6', 'rgba(150,130,110,.6)', 1.2);
  ell(x - r * .62, y - r * .58, r * .15, r * .15, '#F2C6C2'); ell(x + r * .62, y - r * .58, r * .15, r * .15, '#F2C6C2');
  ell(x, y, r * .9, r * .8, rg(x - 3, y - 4, 1, r, ['#FFFFFF', '#F4EDE2']), 'rgba(150,130,110,.6)', 1.2);

/** Múi sầu riêng (khối kem vàng hình giọt dài có gờ). */
function durian(x, y, w, h, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot);
  ell(2, 4, w * .5, h * .5, 'rgba(0,0,0,.1)');
  g.beginPath(); g.moveTo(-w * .5, 0); g.bezierCurveTo(-w * .5, -h * .6, w * .2, -h * .62, w * .55, -h * .05); g.bezierCurveTo(w * .3, h * .55, -w * .45, h * .55, -w * .5, 0); g.closePath();

  for (let i = 0; i < 7; i++) { const a = i * TAU / 7; ell(x + Math.cos(a) * r * .55, y + Math.sin(a) * r * .5, r * .42, r * .36, '#FFFFFF', 'rgba(180,170,150,.5)', .8); }

/**
 * Vẽ mặt trên 1 phần bánh (nhìn từ trên xuống) trong ô (x,y,w,h).
 * seed: cố định vị trí topping cho từng phần.
 */

    if (F.deco === 'mint') mint(x + w * (.3 + R() * .4), y + h * (.3 + R() * .4), .9, R() * 6);
    if (F.deco === 'berry') blueberry(x + w * (.3 + R() * .4), y + h * (.35 + R() * .3), 5);

    for (let i = 0; i < Math.round(w * h / 140); i++) blueberry(x + 6 + R() * (w - 12), y + 6 + R() * (h - 12), 6 + R() * 1.5);

    for (let i = 0; i < w * h / 55; i++) { const px2 = x + R() * w, py = y + R() * h; g.fillStyle = R() < .5 ? '#2A2422' : '#4A403C'; g.beginPath(); g.ellipse(px2, py, .8 + R() * 2.4, .7 + R() * 1.8, R() * 3, 0, TAU); g.fill(); }

    g.fillStyle = 'rgba(120,150,70,.6)'; for (let i = 0; i < w * h / 40; i++) g.fillRect(x + R() * w, y + R() * h, 1.6, 1.6);
    bear(x + w / 2, y + h / 2, Math.min(w, h) * .26);

  const wages = hired().reduce((s, x) => s + staffWage(x), 0);

  if (S.tools?.ban && S.today.served) S.rep = Math.min(100, S.rep + 1);

  const cakesBefore = (S.cakes || []).length; S.cakes = S.tools?.thung ? (S.cakes || []).filter((x) => x.day === S.day) : []; const cakeLeft = cakesBefore - S.cakes.length;
  S.keep = null; let kept = 0;

  shopEndDayPost();
  const before = S.chapter;
  let chapterDone = false;
  if (!S.ended) { const p = chapterProg(); if (p.v >= p.n) chapterDone = true; }
  S.summary = { left, kept, cakeLeft, rewards, chapterDone, chapterTitle: CHAPTERS[before]?.title }; S.flags.tutAgain = false;

}

/** Chữ chạy theo vòng tròn bán kính r; center = góc giữa chữ (−π/2 là đỉnh). bottom = chữ ở cung dưới, đọc trái → phải. */
function arcText(str, r, center, size, color, bottom = false, font = TITLE, weight = 800) {
  g.save(); g.font = `${weight} ${size}px ${font}`; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  const chars = [...str], ws = chars.map((c) => g.measureText(c).width), sp = size * .12;
  const total = ws.reduce((a, b) => a + b + sp, 0) - sp;
  let a = bottom ? center + total / r / 2 : center - total / r / 2;
  chars.forEach((c, i) => {
    const w = ws[i], mid = bottom ? a - w / 2 / r : a + w / 2 / r;
    g.save(); g.rotate(mid); g.translate(r, 0); g.rotate(bottom ? -Math.PI / 2 : Math.PI / 2); g.fillText(c, 0, 0); g.restore();
    a = bottom ? a - (w + sp) / r : a + (w + sp) / r;
  });
  g.restore();
}

/** Kế hoạch cho hôm nay: số khay mỗi vị + số ly nước, mua dư ~15%. */
function buyPlan(trays) {
  const guests = expectGuests(), f = forecast();
  const portions = Math.ceil(guests * .8 * 1.6 * 1.15) + (S.party?.d === S.day ? S.party.n : 0);
  const have = Object.values(S.trays).reduce((a, b) => a + b, 0);
  const nTray = trays ?? Math.max(2, Math.ceil(Math.max(0, portions - have) / PORTIONS));
  const pool = [...new Set([...(S.party?.d === S.day ? [S.party.fk] : []), ...f.favs, ...allTrayFlavors()])].filter((fk) => allTrayFlavors().includes(fk));
  const plan = {};
  const nF = Math.min(pool.length, Math.max(2, Math.min(5, Math.ceil(nTray / 1.5))));
  for (let i = 0; i < nTray; i++) { const fk = pool[i % nF]; plan[fk] = (plan[fk] || 0) + 1; }
  if (S.party?.d === S.day) { const need = Math.ceil(Math.max(0, S.party.n + 3 - (S.trays[S.party.fk] ?? 0)) / PORTIONS); plan[S.party.fk] = Math.max(plan[S.party.fk] || 0, need); }
  const cups = Object.keys(DRINKS).some(drinkUnlocked) ? Math.ceil(guests * .42 * 1.25 * 1.15) : 0;
  return { guests, portions, plan, cups, nTray: Object.values(plan).reduce((a, b) => a + b, 0) };
}
function needOf(P) {
  const need = {}, add = (k, n) => { if (INGR[k]) need[k] = (need[k] ?? 0) + n; };
  for (const [fk, n] of Object.entries(P.plan)) for (const k of recipeOf(fk)) add(k, n);
  const drinks = Object.keys(DRINKS).filter(drinkUnlocked);
  if (P.cups) { add('ly', P.cups); const per = Math.ceil(P.cups / drinks.length); for (const dk of drinks) for (const k of DRINKS[dk].base) add(k, per); for (const k of DRINK_TOPS) if (topOk(k) || (level() >= (topLv[k] ?? 1))) add(k, Math.ceil(P.cups * .2)); }
  const orders = Math.ceil(P.guests * 1.1) + 2;
  add('box', Math.ceil(orders * .9)); add('bag', orders); add('thia', orders);
  for (const k of BOX_EXTRAS) if (level() >= (k === 'kem_cheese' ? 2 : 1)) add(k, Math.ceil(P.guests * .12) + 1);
  return need;
}
function cartFor(need) {
  const cart = {};
  for (const [k, q] of Object.entries(need)) { if (itemLocked(k)) continue; const buy = Math.ceil(Math.max(0, q - (S.inv[k] ?? 0)) / INGR[k].per); if (buy) cart[k] = buy; }
  return cart;
}
function suggestCart() {
  let P = buyPlan(), cart = cartFor(needOf(P));
  const cost = (c) => { const keep = S.cart; S.cart = c; const v = cartTotal(); S.cart = keep; return v; };
  // không đủ tiền: bớt trọn khay (không bớt lẻ nguyên liệu), rồi bớt ly nước
  while (cost(cart) > S.money && P.nTray > 1) { P = buyPlan(P.nTray - 1); cart = cartFor(needOf(P)); }
  while (cost(cart) > S.money && P.cups > 0) { P.cups = Math.max(0, P.cups - 3); cart = cartFor(needOf(P)); }

  sfx.tap();
}

const WC = { on: true };
function wcPasses(build, f, s, w, h) {

  build(0, 0); g.save(); g.globalAlpha = a * .2; g.strokeStyle = '#7A4A2A'; g.lineWidth = 4; g.stroke(); g.restore();
  if (!s && w > 22 && h > 14) { g.save(); g.globalAlpha = a * .55; g.strokeStyle = '#6A4A36'; g.lineWidth = 1.1; build(.9, -.6); g.stroke(); g.restore(); }

  const b = (dx, dy) => rr(x + dx, y + dy, w, h, r);

  if (s) { g.strokeStyle = s; g.lineWidth = lw; g.stroke(); if (WC.on && w > 22) { g.save(); g.globalAlpha *= .35; b(.8, .6); g.stroke(); g.restore(); b(0, 0); } }
};

};

const SPR = new Map();
function spr(key, x, y, w, h, fn, pad = 18) {
  if (!PERF.cache) return fn();

  let e = SPR.get(k);
  if (!e) {
    const c = document.createElement('canvas'), cw = Math.ceil((w + pad * 2) * DPR), ch = Math.ceil((h + pad * 2) * DPR);
    c.width = Math.max(1, cw); c.height = Math.max(1, ch);

    const rec = [], r0 = reg, b0 = buttons; buttons = [];
    reg = (...a) => rec.push(a);
    try { withCtx(ctx, fn); } finally { e = { c, rec, pushed: buttons }; buttons = b0; reg = r0; }

  PERF.lastDraw = now;
  const t0 = performance.now();

  const raf = window.requestAnimationFrame; window.requestAnimationFrame = () => 0;

let last = performance.now(), dragging = false;
function frame(now) {

  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.imageSmoothingEnabled = true;

    case 'daystart': drawDayStart(S.t); break;
    case 'market': drawMarket(S.t); effects(dt); break;
    case 'menu': drawPrepMenu(S.t); effects(dt); break;
    case 'prep': drawPrep(S.t, dt); hud(S.t); break;
    case 'street': drawStreet(S.t, dt); break;
    case 'summary': drawSummary(S.t); break;
    case 'ending': drawEnding(S.t); break;
  }
  if (S.dialog) { buttons = []; drawDialog(S.t); }
  else if (S.quests) { buttons = []; drawQuests(S.t); }

  requestAnimationFrame(frame);
}
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', (e) => {
  const p = pos(e); dragging = true;
  const b = [...buttons].reverse().find((b2) => p.x >= b2.x && p.x <= b2.x + b2.w && p.y >= b2.y && p.y <= b2.y + b2.h);
  if (b && !b.disabled) { if (b.id.startsWith('cs:disp:') && S.scene === 'street' && !S.dialog) { startPour(b.id.slice(8)); return; } onButton(b.id); return; }
  if (S.scene === 'prep' && !S.dialog && !S.quests) prepInput(p.x, p.y, false);
});
cv.addEventListener('pointermove', (e) => { if (dragging && S.scene === 'prep' && !S.quests) { const p = pos(e); prepInput(p.x, p.y, true); } });
addEventListener('pointerup', () => { dragging = false; if (S.pouring) stopPour(); });
addEventListener('pointercancel', () => { dragging = false; if (S.pouring) stopPour(); });
function onButton(id) {
  if (id === 'dialog') return advanceDialog();
  if (id === 'quests') { S.quests = true; sfx.tap(); return; }
  if (id === 'closeQuests') { S.quests = false; sfx.tap(); return; }
  if (id === 'new') { resetProgress(); OV.draft = null; openOv('setup', { mode: 'new', after: startDay }); return; }
  if (id === 'continue') { const d = loadSave(); Object.assign(S, freshPersist(), d); registerRD(); for (const k of Object.keys(INGR)) S.inv[k] ??= 0; applyProfile(); startDay(); return; }
  if (id === 'manage') { openOv('manage', { tab: OV.tab || 'staff' }); return; }
  if (id === 'settings') { openOv('settings', { sub: null, back: null }); return; }
  if (id === 'pause') { openOv('pause', { sub: null }); return; }
  if (id.startsWith('bintab:')) { S.binTab = id.slice(7); sfx.tap(); return; }
  if (id.startsWith('tier:')) { S.tier = +id.slice(5); sfx.tap(); return; }
  if (id.startsWith('slot:')) { focusSlot(S.slots?.[+id.slice(5)]); return; }
  if (id === 'rank') { NET.rows = null; NET.rankTried = false; NET.status = ''; openOv('rank'); return; }
  if (id === 'taiMake') { taiMakeAll(); return; }
  if (id === 'toMarket') { S.scene = 'market'; sfx.tap(); if (S.staff?.mo) { suggestCart(); msg(`Chị Mơ đã chọn sẵn giỏ hàng, rẻ hơn ${Math.round(M().disc * 100)}%`, '#3E7A2E'); } return; }
  if (id.startsWith('inc:')) { const k = id.slice(4); S.cart[k] = (S.cart[k] ?? 0) + 1; sfx.pop(); return; }
  if (id.startsWith('dec:')) { const k = id.slice(4); S.cart[k] = Math.max(0, (S.cart[k] ?? 0) - 1); if (!S.cart[k]) delete S.cart[k]; sfx.pop(); return; }
  if (id === 'suggest') return suggestCart();
  if (id === 'pay') return buyCart();
  if (id === 'backMarket') { S.scene = 'market'; return; }
  if (id.startsWith('make:')) { const fk = id.slice(5); if (!canMake(fk)) return; for (const k of recipeOf(fk)) S.inv[k]--; startPrep(fk); return; }
  if (id.startsWith('makecake:')) { const fk = id.slice(9), list = cakeRecipe(fk); if (!canMakeList(list)) return; for (const k of list) S.inv[k]--; S.cakes = [...(S.cakes || []), { fk, day: S.day }]; S.today.cakesMade = (S.today.cakesMade || 0) + 1; msg(`Đã có 1 bánh kem ${FLAVORS[fk].name} trong tủ`, '#3E7A2E'); sfx.good(); save(); return; }
  if (id.startsWith('mktab:')) { S.mkTab = id.slice(6); sfx.tap(); return; }
  if (id.startsWith('pmtab:')) { S.pmTab = id.slice(6); S.pmPage = 0; sfx.tap(); return; }
  if (id === 'pmprev') { S.pmPage = Math.max(0, S.pmPage - 1); sfx.tap(); return; }
  if (id === 'pmnext') { S.pmPage++; sfx.tap(); return; }
  if (id.startsWith('tool:')) { if (S.prep) S.prep.tool = id.slice(5); sfx.tap(); return; }
  if (id === 'refuse') { refuseCustomer(); return; }
  if (id === 'partyYes') { const ev = todayEv(); S.party = { d: S.day, fk: ev.fk, n: ev.n, pay: ev.pay }; msg(`Đã nhận đơn tiệc ${ev.n} phần ${FLAVORS[ev.fk].name}`, '#3E7A2E'); sfx.good(); save(); return; }
  if (id === 'partyNo') { S.partyNo = S.day; sfx.tap(); save(); return; }
  if (id.startsWith('cs:')) {
    const a = id.slice(3);
    if (a.startsWith('mat:') && a !== 'mat:box') tapMat(+a.slice(4));
    else if (a === 'boxstack') { const b = matBox(); if (b && !b.closed && S.cust && boxReady(S.cust)) closeBox(); else { msg('Chạm khay bánh để xắn, hộp sẽ tự đặt lên thảm', '#8A5A3A'); sfx.tap(); } }
    else if (a === 'bagstack') giveOrder();
    else doAct(a);
    return;
  }
  if (id === 'noop') return;
  if (id === 'autoPrep') { autoPrep(); return; }
  if (id === 'store') { storePrep(); return; }
  if (id === 'toStreet') { startStreet(); return; }
  if (id === 'nextDay') nextDay();
  if (id === 'freeplay') { S.day++; S.daily = []; startDay(); }
}
