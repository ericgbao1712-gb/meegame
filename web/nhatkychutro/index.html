/* ===== THANG MÁY HOẠT HỌA ===== */
.bld-wrap { display: flex; align-items: stretch; position: relative; }
.bld-floors { flex: 1; min-width: 0; }
.elv-shaft {
  width: 52px; flex: none; background: rgba(255,255,255,.35);
  border: 3px solid var(--ink); border-left: 0;
  position: relative; overflow: hidden;
  background-image: repeating-linear-gradient(0deg, rgba(74,51,80,.16) 0 2px, transparent 2px 28px);
}
.elv-cable { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: #6a5a70; transform: translateX(-50%); }
.elv-car {
  position: absolute; left: 3px; right: 3px; height: 72px; bottom: 12px;
  background: rgba(255,255,255,.94); border: 2.5px solid var(--ink); border-radius: 8px;
  box-shadow: 0 4px 12px rgba(0,0,0,.22), inset 0 0 8px rgba(255,214,71,.4);
  transition: bottom 2.2s cubic-bezier(.45,.05,.55,.95);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 4px 2px; z-index: 3;
}
.elv-badge {
  font-family: var(--f-display); font-weight: 800; font-size: 11px; line-height: 1;
  background: var(--ink); color: #ffd447; padding: 2px 6px; border-radius: 6px;
}
.elv-win {
  width: 90%; height: 38px; background: #bfeaff; border: 1.8px solid var(--ink);
  border-radius: 5px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center;
}
.elv-pass { width: 24px; height: 32px; }
.elv-pass svg { width: 100%; height: 100%; }

/* ===== TRẠM ĐIỆN & NƯỚC (image_ca5c8666.png) ===== */
.util-station {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  background: #fdf5e8; border: 3px solid var(--ink); border-top: 0;
  padding: 8px 8px 6px; position: relative;
}
.util-bay {
  position: relative; border: 2.5px solid var(--ink); border-radius: 12px;
  background: #f7ede0; padding: 0 0 6px; cursor: pointer; text-align: center;
  box-shadow: 0 4px 0 var(--ink); transition: transform .1s; overflow: hidden;
}
.util-bay:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.util-awning {
  height: 24px; width: 100%; position: relative;
  border-bottom: 2.5px solid var(--ink);
}
.util-awning.water {
  background: repeating-linear-gradient(90deg, #3d88e0 0 16px, #ffffff 16px 32px);
}
.util-awning.power {
  background: repeating-linear-gradient(90deg, #f27238 0 16px, #ffffff 16px 32px);
}
.util-door {
  height: 60px; margin: 4px 6px; border: 2px solid var(--ink); border-radius: 6px;
  background: #f1ddbc repeating-linear-gradient(0deg, transparent 0 6px, rgba(74,51,80,.14) 6px 8px);
  display: flex; align-items: center; justify-content: center; position: relative;
}
.util-ico { width: 40px; height: 40px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.2)); }
.util-tag {
  display: inline-block; font-family: var(--f-display); font-weight: 800; font-size: 11px;
  padding: 1px 8px; border-radius: 99px; border: 1.5px solid var(--ink);
  background: #fff; margin-top: 2px;
}
.util-tag.water { color: #1e6ec7; }
.util-tag.power { color: #d66415; }

/* ===== 4 MÙA: XUÂN - HẠ - THU - ĐÔNG ===== */
.pill.season { cursor: pointer; }
.pill.season.spring { background: #ffe9f2; }
.pill.season.summer { background: #fff8d6; }
.pill.season.autumn { background: #ffe9dc; }
.pill.season.winter { background: #e3f5ff; }
.season-overlay {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5;
}
.sparticle {
  position: absolute; pointer-events: none; font-size: 14px;
  animation: sfall linear infinite;
}
@keyframes sfall {
  0% { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
  15% { opacity: .9; }
  85% { opacity: .9; }
  100% { transform: translate(80px, 940px) rotate(360deg); opacity: 0; }
}

/* ===== THÀNH PHỐ KHÔNG NGỦ ===== */
#app.sleepless-night {
  background: linear-gradient(#150b2b, #3b174a 70%) !important;
}
.sleepless-sleep {
  position: absolute; inset: 0; background: rgba(18, 9, 36, .85);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #ff9ed4; font-family: var(--f-display); font-weight: 800; font-size: 11.5px;
  z-index: 5; border-radius: 4px; pointer-events: none; text-shadow: 0 0 6px #ff2d87;
}

/* ===== ĐỒNG BỘ TRỜI TỐI CHO BẢN ĐỒ ===== */
#cmap.night-map {
  background: #0d1226 !important;
}
#cmap.night-map .mapsvg {
  filter: brightness(.78) contrast(1.18);
}
#cmap.night-map .mhead {
  background: #1c2140 !important; color: #fff !important; border-bottom-color: #ffd447;
}
#cmap.night-map .mhead h2 { color: #ffd447; }
#cmap.night-map .mhead p { color: #9fd8f5; }
#cmap.night-map .mcard {
  background: #151a33; color: #fff; border-top-color: #ffd447;
}
#cmap.night-map .mcard .hint { color: #9a94bd; }

/* Bảng Điện Nước & Mùa */
.util-card {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center;
  background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 12px;
}
.util-card .u-icon {
  width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
  border: 2px solid var(--ink);
}
.util-card .u-icon.water { background: #e3f2fd; }
.util-card .u-icon.power { background: #fff3e0; }

<style>

html,body{height:100%}

.toast{background:var(--mint);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:1px 8px;font-family:var(--f-display);font-weight:700;font-size:13px;animation:toastIn .3s ease-out,toastOut .4s ease-in 2.6s forwards;width:max-content;max-width:300px}
.toast.pink{background:var(--berry)}
.toast.yel{background:var(--sun);color:var(--ink)}
@keyframes toastIn{from{transform:translateX(-20px);opacity:0}}

.scene{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:96px 0 104px;scrollbar-width:none}

.slab{height:14px;background:var(--brick-deep);border:3px solid var(--ink);border-left-width:3px;margin:0 -6px;display:flex;justify-content:space-around;align-items:center}

.room,.shop{position:relative;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;cursor:pointer;background:#fff;outline:none}

.room .rentbub{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:3px;font-family:var(--f-display);font-weight:800;font-size:12px;background:#fff7c2;border:2.5px solid var(--ink);border-radius:12px;padding:1px 7px;cursor:pointer;box-shadow:0 3px 0 var(--ink);animation:rbob 1.2s ease-in-out infinite;color:var(--ink)}

@keyframes rpop{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-34px);opacity:0}}
.pill.pay.due{background:#fff7c2;animation:rbob2 1.2s ease-in-out infinite}@keyframes rbob2{50%{transform:scale(1.05)}}
.ckin{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}.ckin div{border:2px solid var(--ink);border-radius:10px;background:#fff;text-align:center;padding:3px 0}.ckin small{display:block;font-size:9.5px;font-weight:800;color:var(--muted)}.ckin b{font-family:var(--f-display);font-size:11px}.ckin .got{background:#c9f3dc}.ckin .now{background:#ffd447}
.room .satdot{position:absolute;right:4px;top:4px;font-family:var(--f-display);font-weight:800;font-size:10px;border:2px solid var(--ink);border-radius:8px;padding:0 4px;line-height:1.3;background:var(--mint);color:#fff}
.satdot.mid{background:var(--sun);color:var(--ink)}
.satdot.low{background:var(--berry)}
.char{position:absolute;bottom:4%;width:17%;left:40%;pointer-events:none;z-index:2;transition-property:left,bottom;transition-duration:2s,.6s;transition-timing-function:cubic-bezier(.45,.05,.55,.95),ease}

/* đứng yên */

.steam{position:absolute;left:66%;top:34%;width:10%;height:22%;pointer-events:none;z-index:2}

@keyframes steam{0%{opacity:.9;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-22px) scale(1.7)}}

@keyframes bob{to{transform:translateY(-6%)}}

.ov.locked{background:repeating-linear-gradient(45deg,rgba(74,51,80,.55) 0 10px,rgba(74,51,80,.45) 10px 20px)}

<script>
(()=>{
const INK='#4a3350';

/* ---------- HỆ THỐNG 4 MÙA (XUÂN - HẠ - THU - ĐÔNG) ---------- */
const SEASONS=[
  {id:'spring',name:'Mùa Xuân',icon:'🌸',color:'#ffb3c8',desc:'Hoa nở rực rỡ, chim hót ríu rít. Khách trọ vui vẻ lì xì đầu xuân (+15% tiền trọ).',perkRent:1.15,perkShop:1.0,iconName:'Xuân'},

  {id:'autumn',name:'Mùa Thu',icon:'🍂',color:'#ff9e5e',desc:'Lá vàng lá đỏ bay lơ lửng, chiều thu lãng mạn. Khách trọ vui vẻ, tỷ lệ tặng quà và viết thư tăng cao.',perkRent:1.0,perkShop:1.0,iconName:'Thu'},
  {id:'winter',name:'Mùa Đông',icon:'❄️',color:'#5ec8ff',desc:'Tuyết rơi se lạnh, khói ấm bốc lên từ bếp. Nhu cầu sưởi ấm & nước nóng tăng (+25% tiền trọ điện nước).',perkRent:1.0,perkShop:1.0,iconName:'Đông'},
];
function getSeason(d = (S ? S.day : 1)){
  const idx = Math.floor(((d - 1) % 28) / 7);
  return SEASONS[clamp(idx, 0, 3)];
}
function seasonPerkRent(){
  return getSeason().perkRent || 1.0;
}
function seasonPerkShop(){
  return getSeason().perkShop || 1.0;
}
let currentSeasonParticles = '';
function updateSeasonFX(){
  const s = getSeason();
  const el = $('#seasonOverlay');
  if(!el) return;
  if(currentSeasonParticles === s.id) return;
  currentSeasonParticles = s.id;
  const items = s.id === 'spring' ? ['🌸','💮','🌺']
    : s.id === 'summer' ? ['✨','☀️','🍃']
    : s.id === 'autumn' ? ['🍂','🍁','🌾']
    : ['❄️','❅','🤍'];
  let h = '';
  for(let i=0; i<16; i++){
    const left = Math.random() * 92 + 4;
    const dur = 6 + Math.random() * 8;
    const delay = -(Math.random() * 12);
    const size = 11 + Math.random() * 9;
    const ic = items[i % items.length];
    h += `<span class="sparticle" style="left:${left}%;font-size:${size}px;animation-duration:${dur}s;animation-delay:${delay}s">${ic}</span>`;
  }
  el.innerHTML = h;
}

      {name:'Điện lưới sinh hoạt cơ bản',cost:0,mult:0,sat:0,desc:'Nguồn điện cơ bản sinh hoạt mỗi ngày.'},

function ensureUtil(br = B()){
  br.waterLv = Math.min(5, Math.max(1, br.waterLv || 1));
  br.powerLv = Math.min(5, Math.max(1, br.powerLv || 1));
}
function utilMult(br = B()){
  ensureUtil(br);
  const w = UTILITIES.water.tiers[br.waterLv - 1].mult;
  const p = UTILITIES.power.tiers[br.powerLv - 1].mult;
  const winterBonus = getSeason().id === 'winter' ? 0.25 : 0;
  return 1 + w + p + winterBonus;
}
function utilSat(br = B()){
  ensureUtil(br);
  return UTILITIES.water.tiers[br.waterLv - 1].sat + UTILITIES.power.tiers[br.powerLv - 1].sat;
}

const comfort=r=>['bed','kitchen','desk','bath','decor'].reduce((s,k)=>s+(r.furn[k]||0),0);
const roomRent=(r,br)=>30+(br?BRANCHES[br.t].couple?FURN_C:FURN:FU()).reduce((s,f)=>s+r.furn[f.k]*f.rent,0);
const upCost=(f,lv)=>Math.round(f.cost*3*Math.pow(1.85,lv-(f.min?1:0)));
const B=()=>S.branches[S.cur];

function sat(r,br=B()){const t=r.tenant;if(!t)return 0;let s=60+(comfort(r)-REQ[t.req].c)*5;for(const k in t.needs)s+=br.shops[k].on?6+br.shops[k].lv*2:-8;s+=t.bonus+utilSat(br);return clamp(Math.round(s),5,100);}
const rentPaid=(r,br=B())=>Math.round(Math.min(roomRent(r,br),r.tenant.pay)*BD(br).mult*utilMult(br)*seasonPerkRent());
const unlockCost=i=>Math.round(UNLOCK[i]*BD().mult);
function brStats(br){const occ=br.rooms.filter(r=>r.tenant);let inc=0;occ.forEach(r=>{const p=rentPaid(r,br);inc+=p+Math.round(p*sat(r,br)/100*.35)});
  return {occ:occ.length,open:br.rooms.filter(r=>r.unlocked).length,inc,sat:occ.length?Math.round(occ.reduce((a,r)=>a+sat(r,br),0)/occ.length):0};}
const mood=s=>s>=70?'happy':s>=40?'mid':'sad';
function avgSat(){const t=B().rooms.filter(r=>r.tenant);return t.length?Math.round(t.reduce((a,r)=>a+sat(r),0)/t.length):0;}

  const r=Math.random;

function think(){
  const now=performance.now();
  partners();
  const h=S.min/60;
  B().rooms.forEach((r,i)=>{
    if(!r.tenant)return;
    const a=agentFor(i),el=roomEl(i),c=el.querySelector('.char'),sc=schOf(r.tenant);
    const asleep=inR(h,sc.sleep),wk=sc.work.find(w=>inR(h,w));
    a.awayTxt=wk?`${sc.wt} · về lúc ${hh(wk[1])}`:'';
    // Check sleepless city behavior
    const isSleepless = BD().sleepless;
    const isSleeplessDay = isSleepless && (h >= 6 && h < 18);
    const slTag = el.querySelector('.sleepless-sleep');
    if(isSleeplessDay){
      if(!slTag) el.insertAdjacentHTML('beforeend', '<div class="sleepless-sleep">🌙 Đang ngủ ngày...</div>');
      setState(i, 'sleep');
      a.until = now + 4000;
      return;
    } else if(slTag){
      slTag.remove();
    }
    if(!a.init){a.init=true;c.style.transitionDuration='0s, 0s';c.style.left=a.x+'%';c.style.bottom='4%';c.style.setProperty('--bd',(-Math.random()*4).toFixed(2)+'s');face(c,Math.random()<.5?-1:1);
      if(wk&&!asleep){a.x=SP().door;c.style.left=a.x+'%';setState(i,'away');a.until=now+2000;return;}
      setState(i,'idle');a.until=now+rand(300,2000);return;}
    if(now<a.until)return;
    if(a.after){const {st,dur}=a.after;a.after=null;
      if(st==='sleep'){c.style.bottom=(r.furn.bed>=2?17:1)+'%';face(c,1);}
      if(st==='cook'||st==='sit')face(c,1);
      if(st==='toilet'||st==='shower'||st==='tub')face(c,-1);
      if(st==='tub')c.style.bottom='9%';
      setState(i,st);a.until=now+dur;return;}
    if(a.state==='tub')c.style.bottom='4%';
    if(a.state==='away'){
      if(!wk){
        c.style.transitionDuration='0s, .6s';c.style.left=SP().door+'%';a.x=SP().door;
        a.queue=asleep?[]:['shower','cook'];setState(i,'walk');c.style.opacity='1';
        requestAnimationFrame(()=>requestAnimationFrame(()=>goTo(i,rand(20,45),'idle',800,'fast')));
        a.until=now+400;
      }else a.until=now+3000;
      return;
    }
    if(asleep){if(a.state!=='sleep'){a.queue=[];goTo(i,SP().bed,'sleep',1500);}else a.until=now+1500;return;}
    if(a.state==='sleep'){c.style.bottom='4%';setState(i,'stretch');a.until=now+1900;a.queue=['toilet','shower','cook'];return;}
    if(wk){a.queue=[];goTo(i,SP().door,'away',3000,'fast');return;}
    if(a.queue&&a.queue.length){doActivity(i,r,a,a.queue.shift(),now);return;}
    const evening=h>=18&&h<22,meal=(h>=11&&h<13)||(h>=18&&h<20);
    const base={walk:2.4,idle:1.4,phone:1,look:.8,stretch:.3,toilet:.45,shower:evening?.8:.25,sweep:evening?1:.5,cook:meal?2.6:.9,sit:1.6};
    for(const k in sc.fav)base[k]=(base[k]||0)+sc.fav[k];
    const opts=Object.entries(base);
    let tot=opts.reduce((s,o)=>s+o[1],0),k=Math.random()*tot,ch='idle';
    for(const [n,w] of opts){if((k-=w)<0){ch=n;break;}}
    if(ch===a.state&&ch!=='walk')ch='walk';
    doActivity(i,r,a,ch,now);
  });
}

let AC=null;
function snd(type){
  if(S&&S.sound===false)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    const N={tap:[[700,.04]],coin:[[988,.06],[1319,.1]],up:[[523,.07],[659,.07],[784,.12]],lvl:[[523,.09],[659,.09],[784,.09],[1047,.22]],err:[[196,.16]],gift:[[784,.07],[988,.07],[1175,.07],[1568,.24]],page:[[440,.05],[587,.08]]}[type]||[];
    let d=0;
    for(const [f,l] of N){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.1,t+d+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d+l);
      o.connect(g).connect(AC.destination);o.start(t+d);o.stop(t+d+l+.03);d+=l*.85;}
  }catch(e){}
}

const CLOUD={db:null,user:null,uid:null,me:null,on:false,canAdmin:false,cfg:{},writeOK:true,lastJson:'',lastRow:'',giftsAll:[],giftsMe:[],busy:false,warned:false};
async function cloudInit(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    CLOUD.db=db;CLOUD.user=user;
    if(user){CLOUD.me=await user.me();CLOUD.uid=CLOUD.me.id;CLOUD.canAdmin=!!CLOUD.me.canEdit;}
    if(db){
      db.doc('config/global').onSnapshot(s=>{CLOUD.cfg=s.exists?{...s.data()}:{};hud();if(paused&&SCR.querySelector('.title-scr'))showTitle();if(ADM.open)renderAdmin();},()=>{});
      db.doc('gifts/all').onSnapshot(s=>{CLOUD.giftsAll=s.exists?(s.data().items||[]):[];if(!paused)checkGifts();},()=>{});
    }
    if(db&&CLOUD.uid&&S.cloudLogin)await cloudLogin(true);
    if(paused&&SCR.querySelector('.title-scr'))showTitle();
    if(location.hash==='#admin')openAdmin();
  }catch(e){}
}
async function cloudLogin(silent){
  if(!CLOUD.db||!CLOUD.uid){if(!silent)loginHelp();return;}
  try{
    const ref=CLOUD.db.doc('data/users/'+CLOUD.uid+'/save');
    const snap=await ref.get();
    if(snap.exists){
      const d=snap.data();
      if(d.json&&(d.updated||0)>(S.updated||0)){
        try{const s=JSON.parse(d.json);if(s&&s.v===2){S=s;migRent();buildScene();sky();hud();renderLandlord();toast('Đã tải tiến trình từ máy chủ','yel');}}catch(e){}
      }
    }
    CLOUD.on=true;S.cloudLogin=true;
    CLOUD.db.doc('gifts/'+CLOUD.uid).onSnapshot(s=>{CLOUD.giftsMe=s.exists?(s.data().items||[]):[];if(!paused)checkGifts();},()=>{});
    if(!silent){snd('gift');toast('Đăng nhập thành công! Tiến trình sẽ lưu lên máy chủ.','yel');}
    await cloudSync(true);
    if(paused&&SCR.querySelector('.title-scr'))showTitle();
    if(UI.modal)renderModal();
  }catch(e){if(!silent)toast('Chưa kết nối được máy chủ, thử lại sau nha','pink');}
}
function loginHelp(){
  UI.modal='loginhelp';
  shell('Đăng nhập','Lưu tiến trình lên máy chủ',`<div class="kv">Trang này chưa nhận ra tài khoản của bạn. Hãy mở game khi đã đăng nhập Claude, hoặc nhờ chủ game chia sẻ quyền <b>Cộng tác viên</b> để lưu được tiến trình.</div><p class="hint">Bạn vẫn chơi bình thường được, tiến trình được lưu trên máy này.</p><div class="row end"><button class="btn" data-act="close">Đã hiểu</button></div>`);
}
async function cloudSync(force){
  if(!CLOUD.on||!CLOUD.writeOK||CLOUD.busy||!S.player)return;
  CLOUD.busy=true;
  try{
    const json=JSON.stringify(S);
    if(force||json!==CLOUD.lastJson){
      await CLOUD.db.doc('data/users/'+CLOUD.uid+'/save').set({v:2,json,updated:S.updated||Date.now()});
      CLOUD.lastJson=json;
    }
    const tenants=S.branches.reduce((a,br)=>a+br.rooms.filter(r=>r.tenant).length,0);
    const row={name:S.player.name,house:brName(S.branches[0]),lv:S.lv,money:Math.round(S.money),branches:S.branches.length,tenants,day:S.day,look:S.player.look,home:homeScore()};
    const rs=JSON.stringify(row);
    if(force||rs!==CLOUD.lastRow){await CLOUD.db.doc('players/'+CLOUD.uid).set({...row,updated:Date.now()});CLOUD.lastRow=rs;}
  }catch(e){
    if(e&&e.code==='invalid_argument'){CLOUD.writeOK=false;if(!CLOUD.warned){CLOUD.warned=true;toast('Tài khoản này chỉ có quyền xem. Tiến trình lưu trên máy này.','pink');}}
  }
  CLOUD.busy=false;
}
function pendingGifts(){
  const got=S.giftsGot||[];
  return [...CLOUD.giftsAll,...CLOUD.giftsMe].filter(g=>g&&g.id&&!got.includes(g.id));
}
function checkGifts(){
  if(paused||UI.modal||S.tutActive)return;
  if(pendingGifts().length){UI.modal='gift';renderModal();snd('gift');}
}

/* ---------- mã quà tặng ---------- */
const CODEUI={msg:'',ok:false,busy:false};
async function redeem(raw){
  const code=String(raw||'').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
  const done=(m,ok)=>{CODEUI.msg=m;CODEUI.ok=!!ok;CODEUI.busy=false;if(!ok)snd('err');if(UI.modal==='code')renderModal();};
  if(!code)return done('Nhập mã trước nha.');
  S.redeemed=S.redeemed||[];
  if(S.redeemed.includes(code))return done('Bạn đã dùng mã này rồi.');
  CODEUI.busy=true;if(UI.modal==='code')renderModal();
  let R=BUILTIN_CODES[code]?{...BUILTIN_CODES[code]}:null;
  if(!R&&CLOUD.db){
    try{
      const d=await CLOUD.db.doc('codes/'+code).get();
      if(d.exists){
        const c=d.data();
        if(c.active===false)return done('Mã này đã bị tắt.');
        if(c.expires&&Date.now()>c.expires)return done('Mã này đã hết hạn.');
        if(c.max>0){const q=await CLOUD.db.collection('claims').where(code,'>',0).get();if(q.size>=c.max)return done('Mã này đã hết lượt dùng.');}
        R={money:+c.money||0,xp:+c.xp||0,note:c.note||'Quà tặng'};
      }
    }catch(e){}
  }
  if(!R)return done('Mã không đúng hoặc chưa có trên máy chủ. Kiểm tra lại nha.');
  S.redeemed.push(code);S.money+=R.money;if(R.xp)addXp(R.xp);snd('gift');save();hud();
  done(`Nhận thành công: +${fmt(R.money)} tiền${R.xp?` · +${R.xp} kinh nghiệm`:''}. ${R.note}`,true);
  if(CLOUD.on&&CLOUD.writeOK){try{const ref=CLOUD.db.doc('claims/'+CLOUD.uid);const g=await ref.get();const body=g.exists?{...g.data()}:{};body[code]=Date.now();await ref.set(body);}catch(e){}}
}

function ext(act,arg,a,e){

  if(shopAct(act,a.dataset.act.slice(act.length+1)))return true;
  if(storyAct(act,arg))return true;
  if(staffAct(act,arg))return true;

    case 'ti-start':
      if(!S.player){creator('new');}
      else if(!S.storyDone){story(0,'new');}
      else enterGame();
      return true;
    case 'cr-pre':CR.look={...PRESETS[+arg]};renderCreator();return true;
    case 'cr':{const k=a.dataset.k;let v=a.dataset.v;if(k==='style'||k==='glasses')v=+v;CR.look[k]=v;renderCreator();return true;}
    case 'cr-tab':CRT.tab=arg;renderCreator();return true;
    case 'cr-rand':CR.look=randomLook();renderCreator();return true;
    case 'cr-cancel':closeScreen();UI.modal='profile';renderModal();return true;
    case 'cr-done':{
      const name=(($('#crName')?.value)||CR.name||'').trim()||'Chủ trọ';
      S.player={name,look:{...CR.look,pants:CR.look.pants||'#4a5a8a'}};save();renderLandlord();
      if(CR.mode==='edit'){closeScreen();UI.modal='profile';renderModal();toast('Đã lưu nhân vật','yel');}
      else story(0,'new');
      return true;}
    case 'st-next':snd('page');if(ST.i>=(ST.mode==='replay'?4:5))finishStory();else story(ST.i+1);return true;
    case 'st-skip':if(ST.mode==='replay'){enterGame();}else story(5);return true;
    case 'tut-next':S.tut++;if(S.tut>=TUT.length)endTut(true);else{TT.base={...S.c};renderTut();}return true;
    case 'tut-skip':endTut(false);return true;
    case 'login':cloudLogin(false);return true;
    case 'logout':CLOUD.on=false;S.cloudLogin=false;save();toast('Đã đăng xuất. Tiến trình lưu trên máy này.','pink');renderModal();return true;
    case 'edit-char':close();creator('edit');return true;
    case 'rename-save':{const v=($('#renameInp')?.value||'').trim();if(!v){toast('Tên không được để trống','pink');return true;}B().name=v;buildScene();save();close();toast('Đã đổi tên thành '+v,'yel');return true;}
    case 'redeem':redeem($('#codeInp')?.value);return true;
    case 'gift-claim':{const g=pendingGifts();let tot=0;S.giftsGot=S.giftsGot||[];for(const x of g){tot+=+x.money||0;S.giftsGot.push(x.id);}S.money+=tot;snd('coin');toast(`+${fmt(tot)} quà từ ban quản lý`,'yel');close();hud();save();return true;}
    case 'admin':openAdmin();return true;
    case 'mi':
      switch(arg){
        case 'sound':S.sound=S.sound===false;save();renderModal();return true;
        case 'tut':close();S.tut=0;startTut();return true;
        case 'story':close();paused=true;story(0,'replay');return true;
        case 'login':close();cloudLogin(false);return true;
        case 'admin':close();openAdmin();return true;
        case 'home':openHome();return true;
        case 'rank':UI.modal='rank';loadRank();renderModal();return true;
        case 'code':CODEUI.msg='';UI.modal='code';renderModal();return true;
        default:UI.modal=arg;renderModal();return true;
      }
    case 'open':
      if(arg==='rank'){UI.modal='rank';loadRank();renderModal();return true;}
      if(arg==='code'){CODEUI.msg='';UI.modal='code';renderModal();return true;}
      return false;
  }
  return false;
}

function openAdmin(){
  const el=$('#admin');el.hidden=false;ADM.open=true;
  try{if(location.hash!=='#admin')history.replaceState(null,'','#admin');}catch(e){}
  if(!CLOUD.db){el.innerHTML=admShell(`<div class="box"><h2>Chưa kết nối máy chủ</h2><p class="kv">Trang quản trị chỉ chạy khi mở game trên claude.ai và đã đăng nhập.</p></div>`);return;}
  if(!CLOUD.canAdmin){el.innerHTML=admShell(`<div class="box"><h2>Bạn không có quyền vào đây</h2><p class="kv">Chỉ chủ sở hữu game hoặc người được cấp quyền <b>Chỉnh sửa</b> mới vào được trang quản trị.</p></div>`);return;}
  if(!ADM.subs.length){
    const db=CLOUD.db;
    ADM.subs.push(db.collection('players').onSnapshot(s=>{ADM.players=s.docs.map(d=>({id:d.id,...d.data()}));resolveNames();renderAdmin();},()=>{}));
    ADM.subs.push(db.collection('codes').onSnapshot(s=>{ADM.codes=s.docs.map(d=>({id:d.id,...d.data()}));renderAdmin();},()=>{}));
    ADM.subs.push(db.collection('claims').onSnapshot(s=>{ADM.claims=s.docs.map(d=>({id:d.id,...d.data()}));renderAdmin();},()=>{}));

  renderAdmin();
}

$('#admin').addEventListener('click',async e=>{
  const b=e.target.closest('[data-adm]');if(!b)return;
  const [act,arg]=b.dataset.adm.split(':');const db=CLOUD.db;
  const say=m=>{ADM.msg=m;renderAdmin();setTimeout(()=>{if(ADM.msg===m){ADM.msg='';renderAdmin();}},3500);};
  try{
    if(act==='close'){closeAdmin();return;}
    if(act==='cfg'){await db.doc('config/global').set({announce:$('#aAnn').value.trim(),eventMult:+$('#aEv').value||1,updated:Date.now()});say('Đã lưu thông báo và sự kiện.');return;}
    if(act==='addcode'){
      const id=$('#cId').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
      if(id.length<3){say('Mã cần ít nhất 3 ký tự (chữ in hoa, số, - hoặc _).');return;}
      if(BUILTIN_CODES[id]||ADM.codes.some(c=>c.id===id)){say('Mã '+id+' đã tồn tại.');return;}
      const exp=$('#cExp').value?new Date($('#cExp').value+'T23:59:59').getTime():0;
      await db.doc('codes/'+id).set({money:Math.max(0,+$('#cMoney').value||0),xp:Math.max(0,+$('#cXp').value||0),max:Math.max(0,+$('#cMax').value||0),expires:exp,note:$('#cNote').value.trim(),active:true,created:Date.now()});
      $('#cId').value='';$('#cNote').value='';say('Đã tạo mã '+id+'.');return;}
    if(act==='toggle'){const c=ADM.codes.find(c=>c.id===arg);if(c)await db.doc('codes/'+arg).update({active:c.active===false});return;}
    if(act==='del'){if(ADM.confirmDel!==arg){ADM.confirmDel=arg;renderAdmin();return;}ADM.confirmDel='';await db.doc('codes/'+arg).delete();say('Đã xóa mã '+arg+'.');return;}
    if(act==='gift'){
      const to=$('#gTo').value,money=Math.max(0,+$('#gMoney').value||0),note=$('#gNote').value.trim()||'Quà từ ban quản lý';
      if(!money){say('Nhập số tiền thưởng.');return;}
      const ref=db.doc('gifts/'+to);const g=await ref.get();const items=(g.exists&&g.data().items)||[];
      items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),money,note,at:Date.now()});
      await ref.set({items:items.slice(-20)});say('Đã gửi quà '+fmt(money)+(to==='all'?' cho tất cả người chơi.':'.'));return;}
  }catch(err){say('Không lưu được: '+(err&&err.message||'lỗi máy chủ'));}
});

function shopBuy(id){
  const sh=MSHOPS.find(s=>s.id===SI.id),it=sh&&sh.items.find(i=>i.id===id);if(!it)return;
  if(sh.kind==='fashion'&&owned(it.id))return;
  if(!spend(it.p)){SI.msg='Không đủ tiền rồi.';SI.ok=false;renderShopIn();return;}
  SI.ok=true;SI.hop++;
  if(sh.kind==='food'){
    const until=gameNow()+it.h*60;
    if(!S.buff||BUFF()===1||it.buff>=S.buff.pct)S.buff={pct:it.buff,until,name:it.n};else S.buff.until=Math.max(S.buff.until,until);
    S.c.eat=(S.c.eat||0)+1;addXp(it.xp);snd('coin');SI.bubble=pick(['Ngon quá trời!','Ăn no rồi làm tiếp!','Đúng vị luôn!','Thêm chén nữa!']);
    SI.msg=`Đã ăn ${it.n}: tiền thuê +${S.buff.pct}% trong ${it.h} giờ.`;
  }else if(sh.kind==='fun'){
    SI.ride=it.id;S.buff2={pct:it.buff,until:gameNow()+it.h*60,name:'Vui vẻ'};S.c.fun=(S.c.fun||0)+1;addXp(it.xp);snd('gift');SI.bubble=pick(['Vui quá trời!','Đã ghê!','Lần sau đi tiếp!']);SI.msg=`${it.n}: vui vẻ, tiền nhà +${it.buff}% trong ${it.h} giờ.`;
  }else if(sh.kind==='gift'){
    const n=it.sat*(BD().couple&&it.couple?it.couple:1);let c=0;S.c.gift=(S.c.gift||0)+1;
    B().rooms.forEach((r,i)=>{if(r.tenant){r.tenant.bonus=clamp(r.tenant.bonus+n,-20,30);renderRoom(i);c++;}});
    snd('gift');SI.bubble='Khách sẽ vui lắm!';SI.msg=c?`Đã tặng ${it.n} cho ${c} khách ở ${brName()}: hài lòng +${n}%.`:'Chi nhánh này chưa có khách, quà để dành nha.';
  }else{
    S.owned=S.owned||[];S.owned.push(it.id);const [k,v]=it.id.split(':');
    if(S.player){S.player.look[k]=k==='glasses'?+v:v;if(k==='hat'&&!S.player.look.hcol)S.player.look.hcol='#ff5f8f';}
    snd('gift');SI.bubble='Xinh quá đi!';SI.msg=`Đã mua ${it.n} và mặc luôn. Đổi lại trong Hồ sơ → Đổi nhân vật.`;renderLandlord();
  }
  save();hud();renderShopIn();
}
function shopWear(id){
  if(!S.player||!owned(id))return;const [k,v]=id.split(':');const val=k==='glasses'?+v:v;
  S.player.look[k]=String(S.player.look[k])===String(val)?(k==='glasses'?0:'none'):val;
  SI.msg='';save();hud();renderLandlord();renderShopIn();
}
function shopAct(act,arg){
  if(act==='mshop'){if((S.chap||0)<1){toast('Hoàn thành Chương 1 trong Nhiệm vụ để mở cửa hàng','pink');snd('err');return true;}openShop(arg);return true;}

  if(act==='rentall'){collectAll();renderModal();return true;}
  if(act==='checkin'){checkIn();renderModal();return true;}
  if(act==='rankby'){RANK.by=arg;loadRank();renderModal();return true;}
  if(act==='rideSel'){SI.ride=arg;renderShopIn();return true;}

function renderMap(){
  const el=$('#cmap');
  const sc=el.querySelector('.mbody')?.scrollTop;
  el.innerHTML=`<div class="mhead"><div><h2>Bản đồ thành phố</h2><p>${S.branches.length}/${BRANCHES.length} chi nhánh · tiền nhà +${fmt(S.branches.reduce((a,br)=>a+brStats(br).inc,0))} mỗi ngày</p></div>
    <div class="row"><button class="btn white sm" data-act="maplist">Danh sách</button><button class="x" style="position:static" data-act="mapclose" aria-label="Đóng bản đồ">✕</button></div></div>
    <div class="mbody">${mapSVG()}</div>${mapCard()}`;
  const mb=el.querySelector('.mbody');
  if(sc!=null)mb.scrollTop=sc;
  else{const [,y]=MAPPOS[S.branches[S.cur].t];requestAnimationFrame(()=>{const h=mb.scrollHeight;mb.scrollTop=Math.max(0,y/1100*h-mb.clientHeight/2);});}
}
function openMap(){MAP.open=true;MAP.sel=null;const el=$('#cmap');el.hidden=false;el.innerHTML='';renderMap();}
function closeMap(){MAP.open=false;SI.id=null;$('#cmap').hidden=true;}
function mapAct(act,arg){
  if(act==='map'){close();openMap();return true;}
  if(act==='mapclose'){closeMap();return true;}
  if(act==='maplist'){closeMap();UI.modal='branches';renderModal();return true;}
  if(act==='mapstart'){toast('Chiếc xe bánh tráng năm xưa vẫn đậu trước cổng trường…','yel');return true;}
  if(act==='mapgo'){const t=+arg,bi=S.branches.findIndex(b=>b.t===t);
    if(bi>=0){closeMap();if(bi!==S.cur)switchBranch(bi);else toast('Bạn đang ở '+brName(),'yel');return true;}
    MAP.sel=t;renderMap();return true;}
  if(act==='mapbuy'){const t=+arg,D=BRANCHES[t];if(S.branches.some(b=>b.t===t))return true;
    if(S.lv<D.star){toast(`Cần đạt ★${D.star}`,'pink');snd('err');return true;}
    if(!chapOK(D)){toast(lockText(D)+' trong Nhiệm vụ','pink');snd('err');return true;}
    if(!spend(D.cost))return true;
    S.branches.push(newBranch(t));S.c.branch++;addXp(50);snd('gift');closeMap();switchBranch(S.branches.length-1);toast(`Khai trương ${D.name}!`,'yel');playStory(STORY_OF_BRANCH[t]);return true;}
  return false;
}

function randomLookFixed(n){const L=[{skin:'#ffdcbf',hair:'#6b4226',style:4,shirt:'#5ec8ff',bottom:'skirt',pants:'#ffd447',glasses:0,hat:'none',neck:'none'},{skin:'#f7c69c',hair:'#3b2b2b',style:2,shirt:'#7be0a0',bottom:'pants',pants:'#4a5a8a',glasses:3,gcol:'#4a3350',hat:'none',neck:'none'}];return L[(n-1)%2];}
const STORY_OF_BRANCH={1:'b1',2:'b2',3:'b3',4:'b4',5:'b5',6:'b6',7:'b7'};
const SX={id:null,i:0,after:null};
function playStory(id,after){
  const st=STORY_SETS[id];if(!st)return after&&after();
  S.storiesSeen=S.storiesSeen||[];if(!S.storiesSeen.includes(id))S.storiesSeen.push(id);save();
  SX.id=id;SX.i=0;SX.after=after||null;paused=true;close();if(MAP.open)closeMap();renderStoryX();
}
function renderStoryX(){
  const st=STORY_SETS[SX.id],n=st.panels.length,[sc,tx]=st.panels[SX.i];
  SCR.innerHTML=`<div class="screen story"><div class="stitle">${esc(st.title)}</div><button class="skip" data-act="sx-skip">Bỏ qua ›</button>
    <div class="comic">${sc()}<div class="cap" style="animation:fadeUp .4s ease-out">${tx}</div></div>
    <div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k===SX.i?'on':''}"></i>`).join('')}</div>

function box(x,y,z,w,d,h,c,sw=1.6){const X=x+w,Y=y+d,Z=z+h;
  return poly([[x,Y,z],[X,Y,z],[X,Y,Z],[x,Y,Z]],shade(c,.84),sw)+poly([[X,y,z],[X,Y,z],[X,Y,Z],[X,y,Z]],shade(c,.68),sw)+poly([[x,y,Z],[X,y,Z],[X,Y,Z],[x,Y,Z]],shade(c,1.08),sw);}

  const lie=pose==='sleep';
  return `<g id="isoMe" style="transform:translate(${p.x}px,${p.y+4}px);transition:transform ${HM.walkT||0}s linear"><g class="${pose}${HM.face<0?' left':''}">${charSVG(P,'happy').replace('<svg ',`<svg x="-22" y="-70" width="44" height="72" `)}</g>
   ${a?`<g transform="translate(0 -84)"><rect x="-38" y="-12" width="76" height="16" rx="8" fill="#fff" stroke="${INK}" stroke-width="1.6"/><text x="0" y="0" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="9" fill="${INK}">${esc((ACT_FX[a]||[0,0,''])[2])}${lie?' · Zzz':''}</text></g>`:''}</g>`;
}
function homeSVG(){
  homeMigrate();
  const h=S.home;
  const walls=h.items.map((it,i)=>[it,i]).filter(([it])=>hi(it.k)?.pl==='wall');
  const flats=h.items.map((it,i)=>[it,i]).filter(([it])=>hi(it.k)?.flat);
  const floor=h.items.map((it,i)=>[it,i]).filter(([it])=>hi(it.k)&&hi(it.k).pl!=='wall'&&!hi(it.k).flat);
  const ents=floor.map(([it,i])=>({z:it.c+it.r+(it.c*.01),s:isoItem(it,i)}));
  ents.push({z:HM.pc+HM.pr+.5,s:isoPlayer()});
  for(const k in PETS)if(h.items.some(x=>x.k===k)){const P=petPos(k);ents.push({z:P.c+P.r+.4,s:isoPet(k)});}
  ents.sort((a,b)=>a.z-b.z);
  return `<svg id="hsvg" viewBox="0 -24 400 344" aria-label="Gác mái">${isoRoomBg()}${walls.map(([it,i])=>isoItem(it,i)).join('')}${flats.map(([it,i])=>isoItem(it,i)).join('')}${ents.map(e=>e.s).join('')}</svg>`;
}
function homePanel(){
  const h=S.home;
  const tabs=`<div class="htabs">${HCATS.map(([k,t])=>`<button class="tab ${HM.cat===k?'on':''}" data-act="hcat:${k}">${t}</button>`).join('')}</div>`;
  const ico=d=>D3[d.k]?`<svg viewBox="-46 -84 92 104" aria-hidden="true">${D3[d.k]()}</svg>`:`<svg viewBox="-60 -80 120 90" aria-hidden="true">${d.d()}</svg>`;
  if(HM.mode==='sets'){const P=placedSet();return `<div class="hbar"><b>Bộ sưu tập</b><span class="hint">Bày đủ cả bộ trong phòng để được cộng tiền nhà lâu dài.</span></div><div class="slist">${HSETS.map(s=>{const n=s.items.filter(k=>P.has(k)).length,ok=n===s.items.length;return `<div class="sitem"><div class="sic" style="background:${ok?'#c9f3dc':'#fff3cf'}">${ico(hi(s.items[0]))}</div><div class="sinf"><b>${s.n}${ok?' ✓':''}</b><small>${s.items.map(k=>(P.has(k)?'✓ ':'')+hi(k).n).join(' · ')}</small></div><span class="chip"${ok?' style="background:#c9f3dc"':''}>+${s.b}% · ${n}/${s.items.length}</span></div>`;}).join('')}</div><div class="row end"><button class="btn sm" data-act="hmode:view">Xong</button></div>`;}
  if(HM.mode==='layout'){
    const sel=HM.sel>=0?h.items[HM.sel]:null;
    const inv=HI.filter(d=>d.cat===HM.cat&&(h.inv[d.k]||0)>0);
    return `<div class="hbar"><b>Chế độ bố trí</b><span class="hint">Kéo đồ để di chuyển, đồ tự khớp vào ô. Đồ treo tường kéo dọc 2 bức tường.</span></div>
      ${sel?`<div class="row" style="justify-content:center"><span class="chip">${esc(hi(sel.k).n)}</span><button class="btn sm yel" data-act="hflip">↔ Xoay</button>${hi(sel.k).colors?'<button class="btn sm yel" data-act="hcol">🎨 Đổi màu</button>':''}<button class="btn sm white" data-act="hstore">Cất vào kho</button><button class="btn sm white" data-act="hdesel">Bỏ chọn</button></div>`:''}
      ${tabs}<div class="hgrid">${inv.length?inv.map(d=>`<button class="hcell" data-act="hplace:${d.k}">${ico(d)}<span class="cnt">${h.inv[d.k]}</span><small>${esc(d.n)}</small></button>`).join(''):`<p class="hint" style="grid-column:1/-1">Kho mục này đang trống. Mua thêm ở "Mua đồ".</p>`}</div>
      <div class="row end"><button class="btn" data-act="hmode:view">Xong</button></div>`;
  }
  if(HM.mode==='shop'){
    return `<div class="hbar"><b>Mua đồ trang trí</b><span class="xu">${fmt(S.money)}</span></div>${tabs}
      <div class="hgrid">${HI.filter(d=>d.cat===HM.cat).map(d=>{const lk=hiLock(d);return `<button class="hcell" data-act="hbuy:${d.k}" ${S.money<d.p||lk?'disabled':''}>${ico(d)}${h.inv[d.k]?`<span class="cnt">${h.inv[d.k]}</span>`:''}<small>${esc(d.n)}</small>${lk?`<b class="pr" style="color:#e05a5a;font-size:10px;text-align:center;line-height:1.2">${esc(lk)}</b>`:`<b class="pr">${d.p?fmt(d.p):'Miễn phí'}</b>`}</button>`;}).join('')}</div>
      <div class="row end"><button class="btn white sm" data-act="hmode:view">Quay lại</button><button class="btn sm" data-act="hmode:layout">Bố trí ngay</button></div>`;
  }
  if(HM.mode==='basic'){
    return `<div class="hbar"><b>Tường & sàn</b><span class="hint">Miễn phí, đổi bao nhiêu lần cũng được.</span></div>
      <div class="optrow"><span>Màu tường</span><div class="sw">${WALLC.map(c=>`<button class="${h.wall===c?'on':''}" style="background:${c}" data-act="hwall:${c}" aria-label="Tường ${c}"></button>`).join('')}</div></div>
      <div class="optrow"><span>Sàn nhà</span><div class="sw">${FLOORS.map(([k,t])=>`<button class="txt ${h.floor===k?'on':''}" data-act="hfloor:${k}">${t}</button>`).join('')}</div></div>
      <div class="row end"><button class="btn sm" data-act="hmode:view">Xong</button></div>`;
  }
  const invN=Object.values(h.inv).reduce((a,b)=>a+b,0);
  const acts=[...new Set(h.items.map(it=>ACTS[it.k]).filter(Boolean).map(a=>a.join('|')))].map(x=>x.split('|'));
  return `<div class="hbar"><b>${h.items.length} món đã bày · ${invN} món trong kho</b><span class="xu">${fmt(S.money)}</span></div>
    <div class="kv">🏆 Điểm nhà đẹp: <b>${fmtN(homeScore())}</b> · Bộ sưu tập: <b>${HSETS.filter(setDone).length}/${HSETS.length}</b>${homeSetPct()?` · tiền nhà <b class="good">+${homeSetPct()}%</b>`:''}</div>
    ${HM.msg?`<div class="card" style="background:#c9f3dc"><b>${esc(HM.msg)}</b></div>`:''}
    <p class="hint">Chạm vào đồ đạc trong phòng để nhân vật dùng nó: ngủ, xem phim, nấu ăn, đọc sách… Mỗi hoạt động cho buff "Vui vẻ" tăng tiền nhà.</p>
    ${acts.length?`<div class="row">${acts.map(([a,t])=>`<button class="btn sm yel" data-act="hdo:${a}">${t}</button>`).join('')}</div>`:''}
    <div class="hbtns"><button class="mi" data-act="hmode:layout"><i>🛠️</i>Bố trí</button><button class="mi" data-act="hmode:shop"><i>🛍️</i>Mua đồ</button><button class="mi" data-act="hmode:basic"><i>🎨</i>Tường & sàn</button><button class="mi" data-act="hmode:sets"><i>🏅</i>Bộ sưu tập</button></div>`;
}
function renderHome(){
  const el=$('#home');
  el.innerHTML=`<div class="mhead" style="background:#ffb3c8"><div><h2>Gác mái của ${esc(S.player?.name||'bạn')}</h2><p>Nhà riêng trên sân thượng ${esc(brName(S.branches[0]))}</p></div><button class="x" style="position:static;flex:none" data-act="hclose" aria-label="Rời gác mái">✕</button></div>
   <div class="hscene${HM.mode==='layout'?' layout':''}">${homeSVG()}</div><div class="hpanel">${homePanel()}</div>`;
  bindHomeDrag();
}
function openHome(){
  if(!S.home||!S.home.unlocked){toast('Hoàn thành chương 4 để mở Gác mái','pink');snd('err');return;}
  close();if(MAP.open)closeMap();HM.mode='view';HM.sel=-1;HM.msg='';HM.act=null;$('#home').hidden=false;renderHome();
}
function closeHome(){$('#home').hidden=true;$('#home').innerHTML='';HM.act=null;}
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function ptToTile(x,y){const dx=(x-ISO.OX)/(ISO.TW/2),dy=(y-ISO.OY)/(ISO.TH/2);return [clamp(Math.floor((dy+dx)/2),0,ISO.N-1),clamp(Math.floor((dy-dx)/2),0,ISO.N-1)];}
function ptToWall(x){if(x<ISO.OX)return ['L',clamp(Math.floor((x-(ISO.OX-ISO.N*ISO.TW/2))/(ISO.TW/2)),0,ISO.N-1)];return ['R',clamp(Math.floor((x-ISO.OX)/(ISO.TW/2)),0,ISO.N-1)];}
function bindHomeDrag(){
  const svg=$('#hsvg');if(!svg)return;
  svg.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.hi'),pg=e.target.closest('.pet');
    if(pg&&HM.mode!=='layout'){const k=pg.dataset.pk,P=petPos(k),it=S.home.items.find(x=>x.k===k);if(it)homeDo(PETS[k].act,{...it,c:P.c,r:P.r});return;}
    if(HM.mode!=='layout'){if(g){const it=S.home.items[+g.dataset.hid];const a=ACTS[it.k];if(a)homeDo(a[0],it);}else{const tl=e.target.closest('.tile');if(tl)walkTo(+tl.dataset.c,+tl.dataset.r);}return;}
    if(!g)return;
    const i=+g.dataset.hid;HM.sel=i;HM.drag={i,g};
    svg.querySelectorAll('.hi.sel').forEach(n=>n.classList.remove('sel'));g.classList.add('sel');
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove',e=>{
    const D=HM.drag;if(!D)return;const it=S.home.items[D.i],d=hi(it.k),p=svgPt(svg,e);
    if(d.pl==='wall'){const [w,sl]=ptToWall(p.x);if(w!==it.w||sl!==it.s){it.w=w;it.s=sl;D.g.outerHTML=isoItem(it,D.i);D.g=svg.querySelector(`.hi[data-hid="${D.i}"]`);}}
    else{const [c,r]=ptToTile(p.x,p.y+10);if(c!==it.c||r!==it.r){if(!d.flat&&occupied(c,r,D.i))return;it.c=c;it.r=r;D.g.outerHTML=isoItem(it,D.i);D.g=svg.querySelector(`.hi[data-hid="${D.i}"]`);}}
  });
  const up=()=>{if(!HM.drag)return;HM.drag=null;save();renderHome();};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
}
function walkTo(c,r,then){
  const d=Math.abs(c-HM.pc)+Math.abs(r-HM.pr);
  const from=tileXY(HM.pc,HM.pr),to=tileXY(c,r);
  HM.face=to.x<from.x?-1:1;HM.act=null;HM.walking=true;HM.walkT=Math.max(.3,d*.28);
  const g=$('#isoMe');
  if(g){g.style.transition=`transform ${HM.walkT}s linear`;g.querySelector('g').setAttribute('class','walk'+(HM.face<0?' left':''));const bub=g.querySelector('g[transform]');if(bub)bub.remove();requestAnimationFrame(()=>{g.style.transform=`translate(${to.x}px,${to.y+4}px)`;});}
  HM.pc=c;HM.pr=r;
  clearTimeout(HM._wt);HM._wt=setTimeout(()=>{HM.walking=false;HM.walkT=0;if(then)then();else if(!$('#home').hidden)renderHome();},HM.walkT*1000+60);
}
function homeDo(a,it){
  if(!it)it=S.home.items.find(x=>ACTS[x.k]&&ACTS[x.k][0]===a);if(!it)return;
  if(a==='stars'){const h=S.min/60;if(h>=6&&h<18){HM.msg='Trời còn sáng, chưa thấy sao đâu. Quay lại sau 18h nhé!';renderHome();return;}}
  if(a==='harvest'&&it.hv===S.day){HM.msg='Rau vừa hái hôm nay, mai rau lớn lại nhé!';renderHome();return;}
  let tc=it.c,tr=it.r;
  if(a!=='sleep'){const cand=[[tc+1,tr],[tc,tr+1],[tc-1,tr],[tc,tr-1]].filter(([c,r])=>c>=0&&r>=0&&c<ISO.N&&r<ISO.N&&!occupied(c,r,-1));if(cand.length){[tc,tr]=cand[0];}}
  walkTo(tc,tr,()=>{
    HM.act=a;const [pct,hrs,name]=ACT_FX[a];
    const h=S.min/60;let msg='';
    if(a==='sleep'&&(h>=21||h<5)){
      const target=6*60;let steps=0;
      while(S.min!==target&&steps<20){S.min+=60;if(S.min>=1440){S.min-=1440;S.day++;}S.min=Math.floor(S.min/60)*60;hourTick();steps++;}
      S.min=target;sky();msg=`Bạn ngủ một giấc tới 6h sáng. Tinh thần sảng khoái!`;
    }else msg=`${name}! Tiền nhà +${pct}% trong ${hrs} giờ.`;
    if(a==='harvest'){it.hv=S.day;S.money+=80;msg+=' Bán rau được 80k.';}
    S.buff2={pct,until:gameNow()+hrs*60,name};S.c.homeAct=(S.c.homeAct||0)+1;addXp(4);snd(a==='sleep'?'page':'coin');
    HM.msg=msg;save();hud();renderHome();
    clearTimeout(HM._at);HM._at=setTimeout(()=>{HM.act=null;if(!$('#home').hidden&&HM.mode==='view')renderHome();},a==='sleep'?4000:3200);
  });
}
function homeAct(act,arg){
  const h=S.home;
  switch(act){
    case 'home':openHome();return true;
    case 'hclose':closeHome();return true;
    case 'hmode':HM.mode=arg;HM.sel=-1;HM.msg='';HM.act=null;renderHome();return true;
    case 'hcat':HM.cat=arg;renderHome();return true;
    case 'hdo':homeDo(arg);return true;
    case 'hplace':{if(!(h.inv[arg]>0))return true;h.inv[arg]--;const d=hi(arg);let it;
      if(d.pl==='wall'){const cnt=h.items.filter(x=>x.w).length;it={k:arg,w:cnt%2?'R':'L',s:(cnt*2+1)%ISO.N,f:0};}
      else{const [c,r]=nearestFree(3,3,-1,d.flat);it={k:arg,c,r,f:0};}
      h.items.push(it);HM.sel=h.items.length-1;snd('up');save();renderHome();return true;}
    case 'hflip':{const it=h.items[HM.sel];if(it){it.f=it.f?0:1;save();renderHome();}return true;}
    case 'hstore':{const it=h.items[HM.sel];if(it){h.inv[it.k]=(h.inv[it.k]||0)+1;h.items.splice(HM.sel,1);HM.sel=-1;save();renderHome();}return true;}
    case 'hdesel':HM.sel=-1;renderHome();return true;
    case 'hcol':{const it=h.items[HM.sel],d=it&&hi(it.k);if(d&&d.colors){it.col=((it.col||0)+1)%d.colors.length;save();renderHome();}return true;}
    case 'hbuy':{const d=hi(arg);if(hiLock(d)){toast(hiLock(d),'pink');return true;}if(!spend(d.p))return true;h.inv[arg]=(h.inv[arg]||0)+1;snd('coin');HM.msg='';toast(`Đã mua ${d.n}, cất trong kho`,'yel');save();renderHome();return true;}
    case 'hwall':h.wall=arg;save();renderHome();return true;
    case 'hfloor':h.floor=arg;save();renderHome();return true;
  }
  return false;
}

function storyAct(act,arg){
  switch(act){
    case 'chap-claim':claimChap();return true;
    case 'sx-next':snd('page');{const n=STORY_SETS[SX.id].panels.length;if(SX.i<n-1){SX.i++;renderStoryX();}else endStoryX();}return true;
    case 'sx-skip':endStoryX();return true;
    case 'album':close();if(arg==='intro'){paused=true;story(0,'replay');}else playStory(arg);return true;
    case 'album-lock':toast('Câu chuyện này chưa mở khóa','pink');return true;
  }
  return false;
}

/* ---------- start ---------- */
buildScene();sky();hud();
const scene=$('#scene');requestAnimationFrame(()=>{scene.scrollTop=scene.scrollHeight;});
setInterval(tick,1000);setInterval(think,200);setInterval(chatter,6500);setInterval(tutTick,250);setInterval(landlordMove,4200);
setInterval(()=>cloudSync(false),20000);
setTimeout(chatter,1500);
renderLandlord();showTitle();cloudInit();
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();cloudSync(false);}});
})();
</script>
